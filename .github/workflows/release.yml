name: Release

# "v1.0.0" gibi bir etiket gönderildiğinde exe'leri derleyip GitHub Releases'a taslak olarak yükler.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            release/Arunnel.exe
            release/Arunnel_*_Setup.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: sh scripts/fetch-tpws.sh
      - run: npm ci
      - run: npx tauri build --target universal-apple-darwin
      - run: node scripts/collect-release.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: release/Arunnel_*_macOS.dmg

  release:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: SHA-256 özetleri
        working-directory: release
        run: sha256sum Arunnel.exe Arunnel_*_Setup.exe Arunnel_*_macOS.dmg > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          body_path: docs/SURUM_NOTLARI.md
          files: |
            release/Arunnel.exe
            release/Arunnel_*_Setup.exe
            release/Arunnel_*_macOS.dmg
            release/SHA256SUMS.txt
